<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS do cadastro -->

    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="cadastro.css">
    <title>Cadastro | SquadHub</title>
</head>

<body>

    <main class="container text-white">
        <div class="row min-vh-100 align-items-center">

            <!-- Lado esquerdo -->
            <section class="col-12 col-lg-6 cadastro-apresentacao">
                <div class="cadastro-texto">
                    <h1>
                        BEM-VINDO AO
                        <span>SQUADHUB</span>
                    </h1>

                    <p>
                        ENCONTRE JOGADORES, FORME SQUAD
                        E EVOLUA NO JOGO.
                    </p>
                </div>
                <!-- <div class="logo-container">
                <img
                    src="../../img/SquadHub Logo.png"
                    alt="Logo SquadHub"
                    class="logo-squadhub img-fluid"
                >
            </div> -->
            </section>

            <!-- Lado direito -->
            <section class="col-12 col-lg-6 cadastro-formulario
                        d-flex justify-content-center
                        align-items-center py-5">

                <form class="formulario w-100"
                    onsubmit="window.location.href='../RetornoCadastro/RetornoCadastro.html'; return false;">

                    <div class="formulario-titulo mb-4">
                        <h2>
                            CRIE SUA <span>CONTA</span>
                        </h2>
                        <p>
                            DÊ O PRIMEIRO PASSO PARA FAZER
                            PARTE DO SQUADHUB
                        </p>
                    </div>

                    <div class="campo mb-3">
                        <label for="usuario" class="form-label">
                            <img src="../../img/person.svg" alt="">
                            NOME DE USUÁRIO
                        </label>
                        <input type="text" class="form-control" id="usuario" name="usuario"
                            placeholder="DIGITE SEU NOME DE USUÁRIO" required>
                    </div>

                    <div class="campo mb-3">
                        <label for="email" class="form-label">
                            <img src="../../img/mail.svg" alt="">
                            EMAIL
                        </label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="DIGITE SEU EMAIL"
                            required>
                    </div>

                    <div class="campo mb-3">
                        <label for="senha" class="form-label">
                            <img src="../../img/lock.svg" alt="">
                            SENHA
                        </label>
                        <input type="password" class="form-control" id="senha" name="senha"
                            placeholder="DIGITE SUA SENHA" minlength="8"
                            pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}"
                            title="Use no mínimo 8 caracteres, incluindo maiúscula, minúscula, número e caractere especial."
                            required>
                        
                        <div id="requisitos-senha" class="requisitos-senha">
                            <p>A senha deve conter:</p>

                            <ul>
                                <li id="req-tamanho">8 caracteres no mínimo</li>
                                <li id="req-maiuscula">Uma letra maiúscula</li>
                                <li id="req-minuscula">Uma letra minúscula</li>
                                <li id="req-numero">Um número</li>
                                <li id="req-especial">Um caractere especial</li>
                            </ul>
                        </div>
                       
                    </div>

                    <div class="campo mb-3">
                        <label for="confirmar-senha" class="form-label">
                            <img src="../../img/lock.svg" alt="">
                            CONFIRMAR SENHA
                        </label>

                        <input type="password" class="form-control" id="confirmar-senha" name="confirmar-senha"
                            placeholder="CONFIRME SUA SENHA" required>
                    </div>
                    <div class="form-check mb-4 termos">
                        <input class="form-check-input" type="checkbox" id="termos" required>
                        <label class="form-check-label" for="termos">
                            EU ACEITO OS TERMOS DE USO E A POLÍTICA DE PRIVACIDADE.
                        </label>
                    </div>

                    <button type="submit" class="botao-cadastro w-100">
                        CRIAR CONTA
                        <span class="seta">→</span>
                    </button>

                </form>
            </section>

        </div>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
    <script src="cadastro.js"></script>
</body>

</html>
