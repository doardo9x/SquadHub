<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | SquadHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../src/bootstrap-5.3.8-dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../estilos/variaveis-globais.css">
    <link rel="stylesheet" href="cadastro.css">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../componentes/menu-lateral.css">
</head>

<body>
    <!-- Menu lateral compartilhado -->
    <div id="ponto-menu-lateral"></div>


    <!-- Conteudo principal da pagina -->


    <main class="container text-white">
        <div class="row min-vh-100 align-items-center align-content-start align-content-lg-center">

            <section class="col-12 col-lg-6 d-flex align-items-center justify-content-center justify-content-lg-start text-center text-lg-start px-3 pt-4 pb-3 pt-lg-0 pb-lg-0 ps-lg-5">
                <div class="texto-cadastro w-100">
                    <img src="../../imagens/logo-squadhub.png" alt="SquadHub" class="img-fluid w-25 d-block mx-auto mx-lg-0 mb-3">
                    <h1>
                        BEM-VINDO!
                    </h1>
                    <p>
                        ENCONTRE JOGADORES, FORME SQUAD
                        E EVOLUA NO JOGO.
                    </p>
                </div>
            </section>

            <section class="col-12 col-lg-6 d-flex justify-content-center align-items-center px-3 py-3 py-lg-5">
                <!-- Formulario: coleta os dados de cadastro -->
                    <form class="formulario w-100" onsubmit="window.location.href='../retorno-cadastro/retorno-cadastro.html'; return false;">

                    <!-- Titulo -->
                    <div class="titulo-formulario mb-3 mb-lg-4">
                        <h2>CRIE SUA <span>CONTA</span></h2>
                        <p>
                            DÊ O PRIMEIRO PASSO PARA FAZER
                            PARTE DO SQUADHUB
                        </p>
                    </div>

                    <!-- Campo: Nome de usuario -->
                    <div class="campo-formulario mb-3">
                        <label for="usuario" class="form-label">
                            <img src="../../imagens/pessoa.svg" alt="">
                            NOME DE USUÁRIO
                        </label>
                        <input type="text" class="form-control" id="usuario" name="usuario"
                            placeholder="DIGITE SEU NOME DE USUÁRIO" required>
                    </div>

                    <!-- Campo: Email-->
                    <div class="campo-formulario mb-3">
                        <label for="email" class="form-label">
                            <img src="../../imagens/correio.svg" alt="">
                            EMAIL
                        </label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="DIGITE SEU EMAIL"
                            required>
                    </div>

                    <!-- Campo: Senha -->
                    <div class="campo-formulario mb-3">
                        <label for="senha" class="form-label">
                            <img src="../../imagens/cadeado.svg" alt="">
                            SENHA
                        </label>

                        <div class="campo-senha position-relative">
                            <input type="password" class="form-control pe-5" id="senha" name="senha"
                                placeholder="DIGITE SUA SENHA" minlength="8"
                                pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}"
                                title="Use no mínimo 8 caracteres, incluindo maiúscula, minúscula, número e caractere especial."
                                aria-describedby="requisitos-senha" required>

                            <button type="button" class="botao-olho" data-alternar-senha="senha"
                                aria-label="Exibir senha" aria-pressed="false">
                                <svg class="icone-olho" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                                <svg class="icone-olho-fechado d-none" xmlns="http://www.w3.org/2000/svg" width="20"
                                    height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="m3 3 18 18" />
                                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                                    <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.5 15.5 0 0 1-4 4.8" />
                                    <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.8 10.8 0 0 0 3-.4" />
                                </svg>
                            </button>
                        </div>

                        <div id="requisitos-senha" class="requisitos-senha">
                            <p class="titulo-requisitos">Sua senha deve ter:</p>
                            <ul>
                                <li id="requisito-tamanho">
                                    <span class="icone-requisito">✓</span>
                                    Pelo menos 8 caracteres
                                </li>
                                <li id="requisito-maiuscula">
                                    <span class="icone-requisito">✓</span>
                                    Uma letra maiúscula
                                </li>
                                <li id="requisito-minuscula">
                                    <span class="icone-requisito">✓</span>
                                    Uma letra minúscula
                                </li>
                                <li id="requisito-numero">
                                    <span class="icone-requisito">✓</span>
                                    Um número
                                </li>
                                <li id="requisito-especial">
                                    <span class="icone-requisito">✓</span>
                                    Um caractere especial
                                </li>
                            </ul>
                        </div>
                    </div>

                    <!-- Campo: Confirmar Senha -->
                    <div class="campo-formulario mb-3">
                        <label for="confirmacao-senha" class="form-label">
                            <img src="../../imagens/cadeado.svg" alt="">
                            CONFIRMAR SENHA
                        </label>

                        <div class="campo-senha position-relative">
                            <input type="password" class="form-control pe-5" id="confirmacao-senha" name="confirmacao-senha"
                                placeholder="CONFIRME SUA SENHA" aria-describedby="retorno-senhas" required>

                            <button type="button" class="botao-olho" data-alternar-senha="confirmacao-senha"
                                aria-label="Exibir confirmação da senha" aria-pressed="false">
                                <svg class="icone-olho" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                                <svg class="icone-olho-fechado d-none" xmlns="http://www.w3.org/2000/svg" width="20"
                                    height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="m3 3 18 18" />
                                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                                    <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.5 15.5 0 0 1-4 4.8" />
                                    <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.8 10.8 0 0 0 3-.4" />
                                </svg>
                            </button>
                        </div>

                        <div id="retorno-senhas" class="retorno-senhas" aria-live="polite"></div>
                    </div>

                    <!-- Campo: -->
                    <div class="form-check mb-4 termos">
                        <input class="form-check-input" type="checkbox" id="termos" required>
                        <label class="form-check-label" for="termos">
                            EU ACEITO OS TERMOS DE USO E A POLÍTICA DE PRIVACIDADE.
                        </label>
                    </div>

                    <button type="submit" class="botao-cadastro w-100">
                        CRIAR CONTA
                        <span class="seta">→</span>
                    </button>
                </form>
            </section>
        </div>
    </main>
    <script src="cadastro.js"></script>
    <!-- Rodape compartilhado -->
    <div id="ponto-rodape"></div>


    <script src="../../src/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../componentes/menu-lateral.js"></script>
    <script src="../../componentes/rodape.js"></script>
</body>

</html>
